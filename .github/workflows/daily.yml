name: daily-update
on:
  schedule:
    - cron: "0 1 * * *"
  workflow_dispatch:
jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/daily_update.py
      - name: commit
        run: |
          git config user.name "ainav-bot"
          git config user.email "ainav-bot@users.noreply.github.com"
          git add data/meta.json data/hot.json
          git diff --cached --quiet && echo "no change" && exit 0
          git commit -m "daily: hot 10"
          git push
